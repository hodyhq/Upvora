# Builds and publishes the Upvora Docker image when a release tag lands on
# GitHub (primary CI is GitHub).
# Self-hosters pull ghcr.io/hodylabs/upvora. Older installs pull ghcr.io/hodyhq/upvora,
# which still gets every release so they keep updating. No local build required.
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMITHASH=${{ github.sha }}
          tags: |
            ghcr.io/hodylabs/upvora:${{ github.ref_name }}
            ghcr.io/hodylabs/upvora:latest

      # Existing installs pull ghcr.io/hodyhq/upvora (Hody's personal account). Copy
      # every tag there too, so they keep updating. Needs either a token with
      # write:packages for hodyhq (secret GHCR_HODYHQ_TOKEN) or this repo granted
      # write access on that package; without one this step fails loudly.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ secrets.GHCR_HODYHQ_TOKEN && 'hodyhq' || github.actor }}", password: "${{ secrets.GHCR_HODYHQ_TOKEN || secrets.GITHUB_TOKEN }}" }
      - name: Copy to the old address
        run: |
          for t in "${{ github.ref_name }}" latest; do
            docker buildx imagetools create -t "ghcr.io/hodyhq/upvora:$t" "ghcr.io/hodylabs/upvora:$t"
          done
