name: beta-image
# Replaces the GitLab `publish` job: every push to beta builds the image and
# publishes :beta, :<VERSION> and :<short sha> to ghcr.
on:
  push:
    branches: [beta]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: v
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMITHASH=${{ steps.v.outputs.sha }}
          tags: |
            ghcr.io/hodylabs/upvora:beta
            ghcr.io/hodylabs/upvora:${{ steps.v.outputs.version }}
            ghcr.io/hodylabs/upvora:${{ steps.v.outputs.sha }}

      # Existing installs pull ghcr.io/hodyhq/upvora (Hody's personal account). Copy
      # every tag there too, so they keep updating. Needs either a token with
      # write:packages for hodyhq (secret GHCR_HODYHQ_TOKEN) or this repo granted
      # write access on that package; without one this step fails loudly.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ secrets.GHCR_HODYHQ_TOKEN && 'hodyhq' || github.actor }}", password: "${{ secrets.GHCR_HODYHQ_TOKEN || secrets.GITHUB_TOKEN }}" }
      - name: Copy to the old address
        run: |
          for t in beta "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.sha }}"; do
            docker buildx imagetools create -t "ghcr.io/hodyhq/upvora:$t" "ghcr.io/hodylabs/upvora:$t"
          done
